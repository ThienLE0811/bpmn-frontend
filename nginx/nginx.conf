# ============================================================
# BPMN Frontend - Nginx Configuration
# Production: Serve Angular SPA static files
# ============================================================

# Tuning performance
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # --------------------------------------------------------
    # Backend API upstream
    # Thay đổi địa chỉ/port cho phù hợp môi trường
    # --------------------------------------------------------
    upstream backend_api {
        server host.docker.internal:8080;
        # Nếu không dùng Docker, thay bằng:
        # server 127.0.0.1:8080;
    }

    # ========================================================
    # Server block - Production (port 80)
    # ========================================================
    server {
        listen 80;
        server_name localhost;

        # Root directory chứa Angular build output
        root /usr/share/nginx/html;
        index index.html;

        # --------------------------------------------------
        # Proxy API requests tới backend
        # Mọi request /api/* sẽ được forward tới backend
        # --------------------------------------------------
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (nếu cần)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------
        # Cache static assets (JS, CSS, images, fonts)
        # Angular hash-based filenames -> cache dài hạn
        # --------------------------------------------------
        location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # --------------------------------------------------
        # Angular SPA routing fallback
        # Mọi route không match file thật -> trả về index.html
        # Angular Router sẽ xử lý client-side routing
        # --------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # --------------------------------------------------
        # Không cho phép truy cập file ẩn (.git, .env, ...)
        # --------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Custom error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
