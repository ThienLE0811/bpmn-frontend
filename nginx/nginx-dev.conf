# ============================================================
# BPMN Frontend - Nginx Dev Proxy Configuration
# Development: Reverse proxy tới Angular dev server (ng serve)
# ============================================================
#
# Sử dụng khi muốn test nginx proxy trong môi trường dev
# mà không cần build production.
#
# Chạy: nginx -c /path/to/nginx-dev.conf
# Hoặc copy vào /etc/nginx/conf.d/
# ============================================================

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------
    # Angular Dev Server upstream (ng serve)
    # --------------------------------------------------------
    upstream angular_dev {
        server host.docker.internal:4200;
        # Nếu không dùng Docker, thay bằng:
        # server 127.0.0.1:4200;
    }

    # --------------------------------------------------------
    # Backend API upstream
    # --------------------------------------------------------
    upstream backend_api {
        server host.docker.internal:8080;
        # Nếu không dùng Docker, thay bằng:
        # server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # --------------------------------------------------
        # Proxy API requests tới backend
        # --------------------------------------------------
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --------------------------------------------------
        # Proxy mọi request còn lại tới Angular dev server
        # Bao gồm Hot Module Replacement (HMR) WebSocket
        # --------------------------------------------------
        location / {
            proxy_pass http://angular_dev;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support cho Angular HMR/Live Reload
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --------------------------------------------------
        # Xử lý riêng WebSocket cho ng serve live reload
        # Angular CLI dùng /ng-cli-ws endpoint
        # --------------------------------------------------
        location /ng-cli-ws {
            proxy_pass http://angular_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
