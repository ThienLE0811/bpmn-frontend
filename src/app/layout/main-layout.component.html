<nz-layout class="app-layout">
  <!-- Sidebar Navigation -->
  <nz-sider
    class="app-sider"
    [nzCollapsed]="isCollapsed()"
    [nzTrigger]="null"
    nzTheme="light"
    [nzWidth]="240"
    [nzCollapsedWidth]="72"
  >
    <div class="sider-brand">
      <div class="brand-logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <line x1="3" y1="9" x2="21" y2="9" />
          <line x1="9" y1="21" x2="9" y2="9" />
        </svg>
      </div>
      @if (!isCollapsed()) {
        <div class="brand-title">
          <span class="name">BPMN Platform</span>
          <span class="subtitle">Workflow Engine</span>
        </div>
      }
    </div>

    <ul nz-menu nzMode="inline" [nzInlineCollapsed]="isCollapsed()" class="sider-menu">
      <li nz-menu-item routerLink="/processes" routerLinkActive="nz-menu-item-selected">
        <span class="menu-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
        </span>
        <span>Quy trình BPMN</span>
      </li>

      <li nz-menu-item routerLink="/decisions" routerLinkActive="nz-menu-item-selected">
        <span class="menu-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
        </span>
        <span>Bảng quyết định DMN</span>
      </li>

      <li nz-menu-item nzDisabled>
        <span class="menu-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
        </span>
        <span>Giám sát quy trình</span>
      </li>

      <li nz-menu-item nzDisabled>
        <span class="menu-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </span>
        <span>Cấu hình hệ thống</span>
      </li>
    </ul>
  </nz-sider>

  <!-- Main Content Layout -->
  <nz-layout class="inner-layout">
    <!-- Top Header -->
    <nz-header class="app-header">
      <div class="header-left">
        <button class="toggle-btn" (click)="toggleCollapsed()">
          @if (isCollapsed()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="13 17 18 12 13 7" />
              <polyline points="6 17 11 12 6 7" />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="11 17 6 12 11 7" />
              <polyline points="18 17 13 12 18 7" />
            </svg>
          }
        </button>
        <span class="page-breadcrumb">{{ breadcrumb() }}</span>
      </div>

      <div class="header-right">
        <div class="user-profile">
          <div class="avatar">AD</div>
          <span class="user-name">Admin User</span>
        </div>
      </div>
    </nz-header>

    <!-- Dynamic Content -->
    <nz-content class="app-content">
      <router-outlet></router-outlet>
    </nz-content>

    <!-- Footer -->
    <nz-footer class="app-footer">
      BPMN Platform ©2026 - Xây dựng với Angular & ng-zorro-antd
    </nz-footer>
  </nz-layout>
</nz-layout>
