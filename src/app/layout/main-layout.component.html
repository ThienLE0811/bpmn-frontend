<nz-layout class="app-layout">
  <!-- Sidebar Navigation -->
  <nz-sider
    class="app-sider"
    [nzCollapsed]="isCollapsed()"
    [nzTrigger]="null"
    nzTheme="light"
    [nzWidth]="240"
    [nzCollapsedWidth]="72"
  >
    <div class="sider-brand">
      <div class="brand-logo">
        <span nz-icon nzType="deployment-unit" nzTheme="outline"></span>
      </div>
      @if (!isCollapsed()) {
        <div class="brand-title">
          <span class="name">BPMN Platform</span>
          <span class="subtitle">Workflow Engine</span>
        </div>
      }
    </div>

    <ul nz-menu nzMode="inline" [nzInlineCollapsed]="isCollapsed()" class="sider-menu">
      <li nz-menu-item nzMatchRouter>
        <a routerLink="/dashboard">
          <span class="menu-icon">
            <span nz-icon nzType="dashboard" nzTheme="outline"></span>
          </span>
          <span class="menu-title">Tổng quan & Thống kê</span>
        </a>
      </li>

      <li nz-menu-item nzMatchRouter>
        <a routerLink="/processes">
          <span class="menu-icon">
            <span nz-icon nzType="branches" nzTheme="outline"></span>
          </span>
          <span class="menu-title">Quy trình BPMN</span>
        </a>
      </li>

      <li nz-menu-item nzMatchRouter>
        <a routerLink="/decisions">
          <span class="menu-icon">
            <span nz-icon nzType="table" nzTheme="outline"></span>
          </span>
          <span class="menu-title">Bảng quyết định DMN</span>
        </a>
      </li>

      <li nz-menu-item nzMatchRouter>
        <a routerLink="/users">
          <span class="menu-icon">
            <span nz-icon nzType="team" nzTheme="outline"></span>
          </span>
          <span class="menu-title">Quản lý Người dùng</span>
        </a>
      </li>

      <li nz-menu-item nzDisabled>
        <span class="menu-icon">
          <span nz-icon nzType="setting" nzTheme="outline"></span>
        </span>
        <span class="menu-title">Cấu hình hệ thống</span>
      </li>
    </ul>
  </nz-sider>

  <!-- Main Content Layout -->
  <nz-layout class="inner-layout">
    <!-- Top Header -->
    <nz-header class="app-header">
      <div class="header-left">
        <button class="toggle-btn" (click)="toggleCollapsed()">
          <span
            nz-icon
            [nzType]="isCollapsed() ? 'menu-unfold' : 'menu-fold'"
            nzTheme="outline"
          ></span>
        </button>
        <span class="page-breadcrumb">{{ breadcrumb() }}</span>
      </div>

      <div class="header-right">
        <div class="user-profile">
          <div class="avatar">AD</div>
          <span class="user-name">Admin User</span>
        </div>
      </div>
    </nz-header>

    <!-- Dynamic Content -->
    <nz-content class="app-content">
      <router-outlet></router-outlet>
    </nz-content>

    <!-- Footer -->
    <nz-footer class="app-footer"> BPMN Platform ©2026 - Xây dựng với Angular </nz-footer>
  </nz-layout>
</nz-layout>
