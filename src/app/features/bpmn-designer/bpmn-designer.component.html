<div class="bpmn-designer-layout">
  <!-- Top Navigation / Action Bar -->
  <header class="designer-header">
    <div class="brand-section">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </div>
      <div class="brand-info">
        <span class="app-title">BPMN Flow Designer</span>
        <span class="file-name">
          {{ currentFileName() }}
          <span class="status-badge" [class.modified]="isModified()">
            {{ isModified() ? 'Chưa lưu' : 'Đã đồng bộ' }}
          </span>
        </span>
      </div>
    </div>

    <!-- Actions Bar -->
    <div class="toolbar-actions">
      <!-- File Operations -->
      <div class="btn-group">
        <button class="btn btn-secondary" (click)="createNewDiagram()" title="Tạo sơ đồ mới">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tạo mới
        </button>

        <label class="btn btn-secondary" title="Mở tệp BPMN từ máy tính">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Mở tệp
          <input type="file" (change)="onFileSelected($event)" accept=".bpmn,.xml" style="display: none;" />
        </label>

        <button class="btn btn-primary" (click)="exportXml()" title="Tải xuống XML BPMN">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Tải XML
        </button>

        <button class="btn btn-accent" (click)="exportSvg()" title="Xuất hình ảnh dạng SVG">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Xuất SVG
        </button>
      </div>

      <div class="divider"></div>

      <!-- Controls & History -->
      <div class="btn-group">
        <button class="btn-icon" (click)="undo()" title="Hoàn tác (Undo)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>

        <button class="btn-icon" (click)="redo()" title="Làm lại (Redo)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Zoom Controls -->
      <div class="btn-group">
        <button class="btn-icon" (click)="zoomOut()" title="Thu nhỏ">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>

        <span class="zoom-indicator" (click)="zoomReset()" title="Đặt lại thu phóng">{{ currentZoom() }}%</span>

        <button class="btn-icon" (click)="zoomIn()" title="Phóng to">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Canvas & Sidebar Container -->
  <div class="designer-body">
    <!-- Canvas Area -->
    <div class="canvas-container" #canvas></div>

    <!-- Properties Panel Sidebar -->
    <aside class="properties-sidebar">
      <div class="sidebar-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <h3>Thuộc tính Element</h3>
      </div>

      <div class="sidebar-content">
        @if (selectedElement(); as element) {
          <div class="form-group">
            <label class="form-label">ID Element</label>
            <input type="text" class="form-input readonly-input" [value]="element.id" readonly />
          </div>

          <div class="form-group">
            <label class="form-label">Loại (Type)</label>
            <div class="type-badge">{{ element.type }}</div>
          </div>

          <div class="form-group">
            <label class="form-label">Tên hiển thị (Label)</label>
            <input 
              type="text" 
              class="form-input" 
              [ngModel]="element.name" 
              (ngModelChange)="updateSelectedElementName($event)" 
              placeholder="Nhập tên nút quy trình..." 
            />
          </div>
        } @else {
          <div class="empty-selection">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15l6 6m-6-6a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
            <p>Chọn một phần tử trên sơ đồ để xem và chỉnh sửa thông tin chi tiết.</p>
          </div>
        }
      </div>
    </aside>
  </div>
</div>
