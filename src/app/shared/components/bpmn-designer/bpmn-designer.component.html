<div class="bpmn-designer-layout">
  <!-- Top Navigation / Action Bar -->
  <app-designer-header
    type="bpmn"
    [(title)]="processName"
    [code]="processData?.processKey"
    [isModified]="isModified()"
    [currentZoom]="currentZoom()"
    [readOnly]="readOnly"
    [saveLabel]="saveLabel"
    [showModeSwitch]="true"
    [activeMode]="viewMode()"
    [showSimulation]="viewMode() === 'design' && !readOnly"
    [isSimulationActive]="isSimulationActive()"
    [isSimulationPaused]="isSimulationPaused()"
    [showSaveClose]="showHeaderActions"
    (toggleSimulation)="modeler.toggleSimulation()"
    (simulationPlayPause)="modeler.toggleSimulationPlayPause()"
    (simulationReset)="modeler.resetSimulation()"
    (activeModeChange)="setMode($event)"
    (pasteXml)="xmlSync.pasteFromClipboard()"
    (save)="onSave()"
    (closed)="onClose()"
    (fileSelected)="onFileSelected($event)"
    (exportXml)="modeler.exportXml(processName())"
    (exportSvg)="modeler.exportSvg(processName())"
    (undo)="modeler.undo()"
    (redo)="modeler.redo()"
    (zoomIn)="modeler.zoomIn()"
    (zoomOut)="modeler.zoomOut()"
    (zoomReset)="modeler.fitViewport()"
  />

  <!-- Main Canvas & Sidebar Container -->
  <div
    class="designer-body"
    [class.mode-design]="viewMode() === 'design'"
    [class.mode-xml]="viewMode() === 'xml'"
  >
    <!-- Canvas Area (kept in DOM across all modes to preserve bpmn-js instance) -->
    <div
      class="canvas-container bjs-container"
      [class.readonly]="readOnly"
      [class.hidden-canvas]="viewMode() === 'xml'"
      #canvas
    ></div>

    @if (viewMode() === 'design') {
      <app-bpmn-properties-panel
        [dmnDecisions]="dmnDecisionOptions()"
        [(activeTab)]="propertiesTab"
      />
    }

    @if (viewMode() === 'xml') {
      <app-bpmn-xml-editor [readOnly]="readOnly" />
    }
  </div>
</div>
