<div class="dmn-designer-layout">
  <!-- Top Navigation / Action Bar -->
  <app-designer-header
    type="dmn"
    [(title)]="decisionName"
    [code]="decisionData?.code"
    [isModified]="isModified()"
    [currentZoom]="currentZoom()"
    (save)="onSave()"
    (closed)="onClose()"
    (fileSelected)="onFileSelected($event)"
    (exportXml)="exportXml()"
    (exportSvg)="exportSvg()"
    (undo)="undo()"
    (redo)="redo()"
    (zoomIn)="zoomIn()"
    (zoomOut)="zoomOut()"
    (zoomReset)="zoomReset()"
  />

  <!-- Views Navigation Bar (DRD vs Decision Table) -->
  @if (views().length > 1) {
    <div class="views-bar">
      <div class="views-label">Chế độ xem:</div>
      <div class="view-tabs">
        @for (view of views(); track view.id) {
          <button
            type="button"
            class="view-tab"
            [class.active]="activeViewId() === view.id"
            (click)="switchView(view)"
          >
            @if (view.type === 'drd') {
              <span nz-icon nzType="apartment" nzTheme="outline"></span>
              Sơ đồ DRD
            } @else {
              <span nz-icon nzType="table" nzTheme="outline"></span>
              {{ view.name }}
            }
          </button>
        }
      </div>
    </div>
  }

  <!-- Main DMN Container Area -->
  <div class="designer-body">
    <div class="dmn-canvas-container" #dmnContainer></div>
  </div>
</div>
