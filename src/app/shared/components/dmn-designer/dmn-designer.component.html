<div class="dmn-designer-layout">
  <!-- Top Navigation / Action Bar -->
  <app-designer-header
    type="dmn"
    [(title)]="decisionName"
    [code]="decisionData?.code"
    [isModified]="isModified()"
    [currentZoom]="currentZoom()"
    (save)="onSave()"
    (close)="onClose()"
    (fileSelected)="onFileSelected($event)"
    (exportXml)="exportXml()"
    (exportSvg)="exportSvg()"
    (undo)="undo()"
    (redo)="redo()"
    (zoomIn)="zoomIn()"
    (zoomOut)="zoomOut()"
    (zoomReset)="zoomReset()"
  />

  <!-- Views Navigation Bar (DRD vs Decision Table) -->
  @if (views().length > 1) {
    <div class="views-bar">
      <div class="views-label">Chế độ xem:</div>
      <div class="view-tabs">
        @for (view of views(); track view.id) {
          <button 
            type="button" 
            class="view-tab" 
            [class.active]="activeViewId() === view.id" 
            (click)="switchView(view)"
          >
            @if (view.type === 'drd') {
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              Sơ đồ DRD
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
              {{ view.name }}
            }
          </button>
        }
      </div>
    </div>
  }

  <!-- Main DMN Container Area -->
  <div class="designer-body">
    <div class="dmn-canvas-container" #dmnContainer></div>
  </div>
</div>
