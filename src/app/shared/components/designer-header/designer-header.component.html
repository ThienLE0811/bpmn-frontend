<header class="designer-header">
  <div class="brand-section">
    <div class="brand-logo" [class.dmn-logo]="type() === 'dmn'">
      <span nz-icon [nzType]="type() === 'dmn' ? 'table' : 'branches'" nzTheme="outline"></span>
    </div>
    <div class="brand-info">
      <input
        type="text"
        class="designer-title-input"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        [placeholder]="effectivePlaceholder()"
      />
      <div class="meta-row">
        <span class="status-badge" [class.modified]="isModified()">
          {{ isModified() ? 'Chưa lưu thay đổi' : 'Đã lưu' }}
        </span>
        @if (code()) {
          <span class="entity-code">Mã: {{ code() }}</span>
        }
      </div>
    </div>
  </div>

  <!-- Actions Bar -->
  <div class="toolbar-actions">
    <!-- Save & Close Primary Actions -->
    <div class="btn-group">
      <button class="btn btn-save" (click)="save.emit()" [title]="effectiveSaveLabel()">
        <span nz-icon nzType="save" nzTheme="outline"></span>
        {{ effectiveSaveLabel() }}
      </button>

      <button class="btn btn-close" (click)="closed.emit()" [title]="closeTitle()">
        <span nz-icon nzType="close" nzTheme="outline"></span>
        Đóng
      </button>
    </div>

    <div class="divider"></div>

    <!-- File Actions Dropdown -->
    <div class="btn-group">
      <button
        class="btn btn-secondary dropdown-btn"
        nz-dropdown
        [nzDropdownMenu]="fileMenu"
        nzTrigger="hover"
        nzPlacement="bottomLeft"
        nzOverlayClassName="designer-dropdown-overlay"
        title="Thao tác tệp"
      >
        <span nz-icon nzType="file-text" nzTheme="outline"></span>
        <span>Tệp</span>
        <span nz-icon nzType="down" nzTheme="outline" class="dropdown-icon"></span>
      </button>

      <nz-dropdown-menu #fileMenu="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item (click)="fileInput.click()" title="Mở tệp từ máy tính">
            <span nz-icon nzType="upload" nzTheme="outline" class="dropdown-menu-icon"></span>
            <span>Nhập file</span>
          </li>
          <li nz-menu-divider></li>
          <li nz-menu-item (click)="exportXml.emit()" title="Tải xuống XML">
            <span nz-icon nzType="download" nzTheme="outline" class="dropdown-menu-icon"></span>
            <span>Xuất XML</span>
          </li>
          <li nz-menu-item (click)="exportSvg.emit()" [title]="effectiveSvgTitle()">
            <span nz-icon nzType="file-image" nzTheme="outline" class="dropdown-menu-icon"></span>
            <span>Xuất SVG</span>
          </li>
        </ul>
      </nz-dropdown-menu>

      <input
        #fileInput
        type="file"
        (change)="onFileChange($event)"
        (cancel)="$event.stopPropagation()"
        [accept]="effectiveAccept()"
        style="display: none"
      />
    </div>

    <div class="divider"></div>

    <!-- Controls & History -->
    <div class="btn-group">
      <button class="btn-icon" (click)="undo.emit()" title="Hoàn tác (Undo)">
        <span nz-icon nzType="undo" nzTheme="outline"></span>
      </button>

      <button class="btn-icon" (click)="redo.emit()" title="Làm lại (Redo)">
        <span nz-icon nzType="redo" nzTheme="outline"></span>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Zoom Controls -->
    <div class="btn-group">
      <button class="btn-icon" (click)="zoomOut.emit()" title="Thu nhỏ">
        <span nz-icon nzType="zoom-out" nzTheme="outline"></span>
      </button>

      <span class="zoom-indicator" (click)="zoomReset.emit()" title="Đặt lại thu phóng"
        >{{ currentZoom() }}%</span
      >

      <button class="btn-icon" (click)="zoomIn.emit()" title="Phóng to">
        <span nz-icon nzType="zoom-in" nzTheme="outline"></span>
      </button>
    </div>
  </div>
</header>
