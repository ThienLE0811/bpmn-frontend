<header class="designer-header">
  <div class="brand-section">
    <div class="brand-logo" [class.dmn-logo]="type() === 'dmn'">
      @if (type() === 'dmn') {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <line x1="3" y1="9" x2="21" y2="9" />
          <line x1="9" y1="21" x2="9" y2="9" />
        </svg>
      }
    </div>
    <div class="brand-info">
      <input
        type="text"
        class="designer-title-input"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        [placeholder]="effectivePlaceholder()"
      />
      <div class="meta-row">
        <span class="status-badge" [class.modified]="isModified()">
          {{ isModified() ? 'Chưa lưu thay đổi' : 'Đã lưu' }}
        </span>
        @if (code()) {
          <span class="entity-code">Mã: {{ code() }}</span>
        }
      </div>
    </div>
  </div>

  <!-- Actions Bar -->
  <div class="toolbar-actions">
    <!-- Save & Close Primary Actions -->
    <div class="btn-group">
      <button class="btn btn-save" (click)="save.emit()" [title]="effectiveSaveLabel()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
        {{ effectiveSaveLabel() }}
      </button>

      <button class="btn btn-close" (click)="closed.emit()" [title]="closeTitle()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        Đóng
      </button>
    </div>

    <div class="divider"></div>

    <!-- File Import/Export -->
    <div class="btn-group">
      <label class="btn btn-secondary" title="Mở tệp từ máy tính">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg>
        Nhập file
        <input
          type="file"
          (change)="onFileChange($event)"
          [accept]="effectiveAccept()"
          style="display: none"
        />
      </label>

      <button class="btn btn-secondary" (click)="exportXml.emit()" title="Tải xuống XML">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Xuất XML
      </button>

      <button class="btn btn-secondary" (click)="exportSvg.emit()" [title]="effectiveSvgTitle()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg>
        Xuất SVG
      </button>
    </div>

    <div class="divider"></div>

    <!-- Controls & History -->
    <div class="btn-group">
      <button class="btn-icon" (click)="undo.emit()" title="Hoàn tác (Undo)">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
        </svg>
      </button>

      <button class="btn-icon" (click)="redo.emit()" title="Làm lại (Redo)">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10" />
        </svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Zoom Controls -->
    <div class="btn-group">
      <button class="btn-icon" (click)="zoomOut.emit()" title="Thu nhỏ">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
          <line x1="8" y1="11" x2="14" y2="11" />
        </svg>
      </button>

      <span class="zoom-indicator" (click)="zoomReset.emit()" title="Đặt lại thu phóng"
        >{{ currentZoom() }}%</span
      >

      <button class="btn-icon" (click)="zoomIn.emit()" title="Phóng to">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
          <line x1="11" y1="8" x2="11" y2="14" />
          <line x1="8" y1="11" x2="14" y2="11" />
        </svg>
      </button>
    </div>
  </div>
</header>
